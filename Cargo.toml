[package]
name = "icao-shared-kernel"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Validated value objects and aggregates for ICAO aviation concepts (flights, aircraft, pilots' licences, flight simulation training devices), shared by the Open Aviation Solutions tools."
repository = "https://github.com/Open-Aviation-Solutions/icao-shared-kernel"
readme = "README.md"

[lib]
name = "icao_shared_kernel"
path = "src/lib.rs"

[dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["macros", "serde", "formatting", "parsing"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rust_decimal = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["macros"] }
serde_json = "1"
rust_decimal = "1"
rust_decimal_macros = "1"
rstest = "0.23"
